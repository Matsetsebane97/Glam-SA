services:
  - type: web
    name: glam-sa
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r backend/requirements.txt &&
      npm ci --prefix frontend &&
      npm run build --prefix frontend &&
      rm -rf backend/static/app &&
      mkdir -p backend/static/app &&
      cp -R frontend/dist/. backend/static/app/ &&
      python backend/manage.py migrate --noinput &&
      python backend/manage.py collectstatic --noinput
    startCommand: python backend/manage.py ensure_admin && gunicorn config.wsgi:application --chdir backend --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: glam-sa-db
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: glam-sa-db
    plan: free
